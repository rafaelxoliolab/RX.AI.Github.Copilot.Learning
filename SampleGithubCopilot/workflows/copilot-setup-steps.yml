name: "Copilot Setup Steps"
on: workflow_dispatch

jobs: 
  copilot-setup-steps
    runs-on: ubuntu-latest
    permsissions:
      contents: read

    steps:
     - name: Checkout code
     uses: actions/checkout
    
    - name: Set up Node.js
      uses: actions/setup-node
      with:
        node-version: "18"
    - name: Authenticate with our API Key
      run: echo "API_KEY=${{ secrets.API_KEY }}" >> .secret

